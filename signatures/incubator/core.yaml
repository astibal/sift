      - project: suricata
        url: https://github.com/OISF/suricata/blob/4badfd13f43e112dd61c5cbab5718765512ed5ad/rust/src/http2/http2.rs
        note: Validate 24-bit length, known frame type, flags, reserved bit and stream-id constraints.

