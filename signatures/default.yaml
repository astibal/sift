    candidates: [{side: L, regex: '^[Uu][Ss][Ee][Rr] '}, {side: R, regex: '^(120|220)[ -]'}]
    sources: [{project: zeek, url: https://github.com/zeek/zeek/blob/5b7c9c753a8e69da4a6dcd41e7a06c26226647dd/scripts/base/protocols/ftp/dpd.sig}]
  - name: enc.tls.protocol.ftp
