  - name: security.tls.client-hello
    match: [{side: L, op: tls_handshake, type: 1}]
    candidates: [{side: L, regex: '^\x16\x03[\x00-\x0f]..\x01'}]
  - name: security.tls.server-hello
    match: [{side: R, op: tls_handshake, type: 2}]
    candidates: [{side: R, regex: '^\x16\x03[\x00-\x0f]..\x02'}]
  - name: protocol.ssh.banner-both
    match: [{side: L, op: line_prefix_within, value: "SSH-", limit: 255}, {side: R, op: line_prefix_within, value: "SSH-", limit: 255}]
    candidates: [{side: E, regex: '(^|\x0a)SSH-[12]\.'}]
