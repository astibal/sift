version: 1
signatures:
  - name: protocol.http1.request
    match: [{side: L, op: prefix_any, values: ["OPTIONS ", "GET ", "HEAD ", "POST ", "PUT ", "DELETE ", "CONNECT ", "PATCH ", "PROPFIND ", "PROPPATCH ", "TRACE ", "UPDATE "]}]
    candidates: [{side: L, regex: '^(OPTIONS|GET|HEAD|POST|PUT|DELETE|CONNECT|PATCH|PROPFIND|PROPPATCH|TRACE|UPDATE) '}]
  - name: protocol.http1.response
    match: [{side: R, op: prefix, value: "HTTP/"}]
    candidates: [{side: R, regex: '^HTTP/[0-9]'}]
  - name: protocol.http2.prior-knowledge
    match: [{side: L, op: prefix, value: "PRI * HTTP/2.0\r\n\r\nSM\r\n\r\n"}]
    candidates: [{side: L, regex: '^PRI \* HTTP/2\.0\x0d\x0a\x0d\x0aSM\x0d\x0a\x0d\x0a'}]
  - name: protocol.http2
    match: [{field: flow.http2, op: equals_any, values: ["true"]}]
  - name: protocol.http1
    match: [{field: flow.http1, op: equals_any, values: ["true"]}]
  - name: protocol.http3
    match: [{field: flow.http3, op: equals_any, values: ["true"]}]
  - name: protocol.dns.udp
    match: [{field: flow.transport, op: equals_any, values: [udp]}, {side: E, op: size_between, min: 17, max: 4096}, {side: E, op: uint_at, offset: 2, width: 2, endian: be, mask: 112, masked_value: 0}, {side: E, op: uint_at, offset: 4, width: 2, endian: be, min: 1, max: 16}, {side: E, op: label_sequence_at, offset: 12, max_label: 63, trailing_min: 4}]
    candidates: [{side: E, regex: '^....\x00[\x01-\x10]'}]
    sources: [{project: rfc-editor, url: https://www.rfc-editor.org/rfc/rfc1035.html#section-4.1}]
  - name: protocol.dns.tcp
    match: [{field: flow.transport, op: equals_any, values: [tcp]}, {side: E, op: size_from_uint_at, offset: 0, width: 2, endian: be, adjustment: 2}, {side: E, op: uint_at, offset: 4, width: 2, endian: be, mask: 112, masked_value: 0}, {side: E, op: uint_at, offset: 6, width: 2, endian: be, min: 1, max: 16}, {side: E, op: label_sequence_at, offset: 14, max_label: 63, trailing_min: 4}]
    candidates: [{side: E, regex: '^......\x00[\x01-\x10]'}]
    sources: [{project: rfc-editor, url: https://www.rfc-editor.org/rfc/rfc1035.html#section-4.2.2}]
  - name: enc.tls.protocol.http1
    match: [{field: flow.tls.alpn, op: equals_any, values: ["http/1.0", "http/1.1"]}]
    sources: [{project: iana, url: https://www.iana.org/assignments/tls-extensiontype-values/tls-extensiontype-values.xhtml#alpn-protocol-ids}]
  - name: enc.tls.protocol.http2
    match: [{field: flow.tls.alpn, op: equals_any, values: [h2]}]
    sources: [{project: iana, url: https://www.iana.org/assignments/tls-extensiontype-values/tls-extensiontype-values.xhtml#alpn-protocol-ids}]
  - name: enc.quic.protocol.http3
    match: [{field: flow.quic.alpn, op: equals_any, values: [h3, h3-29]}]
    sources: [{project: iana, url: https://www.iana.org/assignments/tls-extensiontype-values/tls-extensiontype-values.xhtml#alpn-protocol-ids}]
  - name: security.tls.client-hello
    match: [{side: L, op: tls_handshake, type: 1}]
    candidates: [{side: L, regex: '^\x16\x03[\x00-\x0f]..\x01'}]
  - name: security.tls.server-hello
    match: [{side: R, op: tls_handshake, type: 2}]
    candidates: [{side: R, regex: '^\x16\x03[\x00-\x0f]..\x02'}]
  - name: protocol.ssh.banner-both
    match: [{side: L, op: line_prefix_within, value: "SSH-", limit: 255}, {side: R, op: line_prefix_within, value: "SSH-", limit: 255}]
    candidates: [{side: E, regex: '(^|\x0a)SSH-[12]\.'}]
  - name: protocol.ftp.control
    match: [{side: L, op: prefix_any_ci, values: ["USER "]}, {side: R, op: prefix_any, values: ["120 ", "120-", "220 ", "220-"]}]
    candidates: [{side: L, regex: '^[Uu][Ss][Ee][Rr] '}, {side: R, regex: '^(120|220)[ -]'}]
    sources: [{project: zeek, url: https://github.com/zeek/zeek/blob/5b7c9c753a8e69da4a6dcd41e7a06c26226647dd/scripts/base/protocols/ftp/dpd.sig}]
  - name: protocol.socks4.connect
    match: [{side: L, op: hex_at, offset: 0, value: "0401"}, {side: R, op: hex_at, offset: 0, value: "005A"}]
    candidates: [{side: L, regex: '^\x04\x01'}, {side: R, regex: '^\x00\x5a'}]
    sources: [{project: zeek, url: https://github.com/zeek/zeek/blob/5b7c9c753a8e69da4a6dcd41e7a06c26226647dd/scripts/base/protocols/socks/dpd.sig}]
  - name: protocol.socks5.no-auth
    match: [{side: L, op: hex_at, offset: 0, value: "050100"}, {side: R, op: hex_at, offset: 0, value: "0500"}]
    candidates: [{side: L, regex: '^\x05\x01\x00'}, {side: R, regex: '^\x05\x00'}]
    sources: [{project: zeek, url: https://github.com/zeek/zeek/blob/5b7c9c753a8e69da4a6dcd41e7a06c26226647dd/scripts/base/protocols/socks/dpd.sig}]
  - name: protocol.smb1.netbios
    match: [{side: E, op: hex_at, offset: 4, value: FF534D42}]
    candidates: [{side: E, regex: '^....\xffSMB'}]
  - name: protocol.smb2.netbios
    match: [{side: E, op: hex_at, offset: 4, value: fe534d42}]
    candidates: [{side: E, regex: '^....\xfeSMB'}]
  - name: protocol.smb3.encrypted
    match: [{side: E, op: hex_at, offset: 4, value: fd534d42}]
    candidates: [{side: E, regex: '^....\xfdSMB'}]
  - name: protocol.postgresql.sslrequest
    match: [{side: L, op: hex_at, offset: 0, value: 0000000804d2162f}, {side: R, op: prefix_any, values: [S, N]}]
    candidates: [{side: L, regex: '^\x00\x00\x00\x08\x04\xd2\x16\x2f'}, {side: R, regex: '^[SN]'}]
  - name: protocol.mysql.server-greeting
    match: [{side: R, op: size_between, min: 20, max: 16777219}, {side: R, op: size_from_uint_at, offset: 0, width: 3, endian: le, adjustment: 4}, {side: R, op: hex_at, offset: 3, value: "00"}, {side: R, op: hex_at, offset: 4, value: "0A"}]
    candidates: [{side: R, regex: '^...\x00\x0a[0-9]'}]
    sources: [{project: wireshark, url: https://github.com/wireshark/wireshark/blob/6cf21a765b876ad27722a1fb7daa97886e42d544/epan/dissectors/packet-mysql.c}]
  - name: protocol.bgp.message
    match: [{field: flow.transport, op: equals_any, values: [tcp]}, {side: E, op: size_between, min: 19, max: 4096}, {side: E, op: hex_at, offset: 0, value: "FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"}, {side: E, op: size_from_uint_at, offset: 16, width: 2, endian: be}, {side: E, op: uint_at, offset: 18, width: 1, endian: be, min: 1, max: 5}]
    candidates: [{side: E, regex: '^\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff'}]
    sources: [{project: rfc-editor, url: https://www.rfc-editor.org/rfc/rfc4271.html#section-4.1}]
  - name: protocol.ldap.ber-message
    match: [{field: flow.transport, op: equals_any, values: [tcp, udp]}, {side: E, op: ber_sequence, tag: 48, children: [{tag: 2}, {tag_min: 96, tag_max: 119}]}]
    candidates: [{side: E, regex: '^\x30'}]
    sources: [{project: rfc-editor, url: https://www.rfc-editor.org/rfc/rfc4511.html#section-4.1.1}]
  - name: protocol.snmp.ber-message
    match: [{field: flow.transport, op: equals_any, values: [udp, tcp]}, {side: E, op: ber_sequence, tag: 48, children: [{tag: 2}, {tag: 4}, {tag_min: 160, tag_max: 168}]}]
    candidates: [{side: E, regex: '^\x30'}]
    sources: [{project: rfc-editor, url: https://www.rfc-editor.org/rfc/rfc3416.html#section-4}]
  - name: protocol.rfb.banner-both
    match: [{side: L, op: prefix, value: "RFB "}, {side: R, op: prefix, value: "RFB "}]
    candidates: [{side: E, regex: '^RFB '}]
  - name: protocol.sip.dialog
    match: [{side: L, op: prefix_any, values: ["REGISTER ", "INVITE ", "BYE ", "OPTIONS "]}, {side: R, op: prefix, value: "SIP/2.0"}]
    candidates: [{side: L, regex: '^(REGISTER|INVITE|BYE|OPTIONS) '}, {side: R, regex: '^SIP/2\.0'}]
  - name: protocol.bittorrent.handshake
    match: [{side: E, op: hex_at, offset: 0, value: 13426974546f7272656e742070726f746f636f6c}]
    candidates: [{side: E, regex: '^\x13BitTorrent protocol'}]
  - name: protocol.amqp.v091
    match: [{side: L, op: hex_at, offset: 0, value: 414d515000000901}]
    candidates: [{side: L, regex: '^AMQP\x00\x00\x09\x01'}]
  - name: protocol.amqp.v10
    match: [{side: L, op: hex_at, offset: 0, value: 414d515000010000}]
    candidates: [{side: L, regex: '^AMQP\x00\x01\x00\x00'}]
  - name: protocol.amqp.sasl
    match: [{side: L, op: hex_at, offset: 0, value: 414d515003010000}]
    candidates: [{side: L, regex: '^AMQP\x03\x01\x00\x00'}]
  - name: protocol.ajp13.ping
    match: [{side: L, op: hex_at, offset: 0, value: 123400010a}]
    candidates: [{side: L, regex: '^\x12\x34\x00\x01\x0a'}]
  - name: protocol.ajp13.cpong
    match: [{side: R, op: hex_at, offset: 0, value: "4142000109"}]
    candidates: [{side: R, regex: '^AB\x00\x01\x09'}]
  - name: protocol.memcached.ascii
    match: [{side: L, op: prefix_any, values: ["get ", "gets ", "set ", "add ", "replace ", "append ", "prepend ", "cas ", "delete ", "incr ", "decr ", "touch ", "stats\r", "version\r", flush_all]}]
    candidates: [{side: L, regex: '^(get|gets|set|add|replace|append|prepend|cas|delete|incr|decr|touch) '}, {side: L, regex: '^(stats|version)\x0d'}, {side: L, regex: '^flush_all'}]
  - name: protocol.smtp
    match: [{side: L, op: prefix_any_ci, values: ["EHLO ", "HELO "]}, {side: R, op: decimal_prefix, digits: 3, separators: " -"}]
    candidates: [{side: L, regex: '^([Ee][Hh][Ll][Oo]|[Hh][Ee][Ll][Oo]) '}, {side: R, regex: '^[0-9]{3}[ -]'}]
    sources: [{project: zeek, url: https://github.com/zeek/zeek/blob/5b7c9c753a8e69da4a6dcd41e7a06c26226647dd/scripts/base/protocols/smtp/dpd.sig}]
  - name: protocol.imap
    match: [{side: R, op: prefix_any_ci, values: ["* OK ", "* PREAUTH ", "* BYE "]}]
    candidates: [{side: R, regex: '^\* ([Oo][Kk]|[Pp][Rr][Ee][Aa][Uu][Tt][Hh]|[Bb][Yy][Ee]) '}]
    sources: [{project: suricata, url: https://github.com/OISF/suricata/blob/4badfd13f43e112dd61c5cbab5718765512ed5ad/src/app-layer-imap.c#L64-L115}]
  - name: enc.tls.protocol.imap
    match: [{field: flow.tls.alpn, op: equals_any, values: [imap]}]
    sources: [{project: iana, url: https://www.iana.org/assignments/tls-extensiontype-values/tls-extensiontype-values.xhtml#alpn-protocol-ids}]
  - name: protocol.pop3
    match: [{side: L, op: prefix_any_ci, values: ["USER ", "APOP ", "CAPA\r", "AUTH ", "STLS\r"]}, {side: R, op: prefix_any_ci, values: ["+OK ", "+OK\r"]}]
    candidates: [{side: L, regex: '^([Uu][Ss][Ee][Rr] |[Aa][Pp][Oo][Pp] |[Cc][Aa][Pp][Aa]\x0d|[Aa][Uu][Tt][Hh] |[Ss][Tt][Ll][Ss]\x0d)'}, {side: R, regex: '^\+[Oo][Kk]( |\x0d)'}]
    sources: [{project: zeek, url: https://github.com/zeek/zeek/blob/5b7c9c753a8e69da4a6dcd41e7a06c26226647dd/scripts/base/protocols/pop3/dpd.sig}]
  - name: enc.tls.protocol.pop3
    match: [{field: flow.tls.alpn, op: equals_any, values: [pop3]}]
    sources: [{project: iana, url: https://www.iana.org/assignments/tls-extensiontype-values/tls-extensiontype-values.xhtml#alpn-protocol-ids}]
  - name: enc.tls.app.youtube.video
    match: [{field: flow.tls.sni, op: domain_suffix_any, values: [googlevideo.com]}]
  - name: enc.tls.app.youtube
    match: [{field: flow.tls.sni, op: domain_suffix_any, values: [youtube.com, youtube-nocookie.com, youtu.be, ytimg.com, youtubei.googleapis.com]}]
  - name: app.youtube.video
    match: [{fields: [flow.http1.host, flow.http2.authority, flow.http3.authority], op: domain_suffix_any, values: [googlevideo.com]}]
  - name: app.youtube
    match: [{fields: [flow.http1.host, flow.http2.authority, flow.http3.authority], op: domain_suffix_any, values: [youtube.com, youtube-nocookie.com, youtu.be, ytimg.com, youtubei.googleapis.com]}]
