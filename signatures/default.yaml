  - name: protocol.socks4.connect
    match: [{side: L, op: hex_at, offset: 0, value: "0401"}, {side: R, op: hex_at, offset: 0, value: "005A"}]
    candidates: [{side: L, regex: '^\x04\x01'}, {side: R, regex: '^\x00\x5a'}]
