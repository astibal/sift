    match: [{side: L, op: hex_at, offset: 0, value: "050100"}, {side: R, op: hex_at, offset: 0, value: "0500"}]
    candidates: [{side: L, regex: '^\x05\x01\x00'}, {side: R, regex: '^\x05\x00'}]
    sources: [{project: zeek, url: https://github.com/zeek/zeek/blob/5b7c9c753a8e69da4a6dcd41e7a06c26226647dd/scripts/base/protocols/socks/dpd.sig}]
  - name: protocol.smb1.netbios
