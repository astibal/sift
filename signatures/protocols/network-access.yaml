  - name: protocol.ssh.banner-both
    match:
      - side: L
        op: line_prefix_within
        value: "SSH-"
        limit: 255
      - side: R
        op: line_prefix_within
        value: "SSH-"
        limit: 255
    candidates:
      - side: E
        regex: '(^|\x0a)SSH-[12]\.'
  - name: protocol.ftp.control
    match:
