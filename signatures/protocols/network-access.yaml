signatures:
  - name: protocol.stun.binding-request
    match:
      - field: flow.transport
        op: equals_any
        values:
          - udp
      - side: L
        op: size_between
        min: 20
        max: 65555
      - side: L
        op: hex_at
        offset: 0
        value: "0001"
      - side: L
        op: size_from_uint_at
        offset: 2
        width: 2
        endian: be
        adjustment: 20
      - side: L
        op: hex_at
        offset: 4
        value: "2112A442"
    candidates:
      - side: L
        regex: '^\x00\x01..\x21\x12\xa4\x42'
    sources:
      - project: rfc-editor
        url: https://www.rfc-editor.org/rfc/rfc8489.html#section-5
