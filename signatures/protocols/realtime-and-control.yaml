signatures:
  - name: protocol.rtsp.request
    match:
      - field: flow.transport
        op: equals_any
        values:
          - tcp
      - side: L
        op: candidate_seen
    candidates:
      - side: L
        regex: '^(?:\x0d\x0a){0,4}(?:DESCRIBE|GET_PARAMETER|OPTIONS|PAUSE|PLAY|PLAY_NOTIFY|REDIRECT|SETUP|SET_PARAMETER|TEARDOWN|ANNOUNCE|RECORD) (?:rtsps?://[^\x20\x0d\x0a]+|\*) RTSP/[12]\.0\x0d\x0a'
    sources:
      - project: rfc-editor
        url: https://www.rfc-editor.org/rfc/rfc7826.html#section-7.1
      - project: rfc-editor
        url: https://www.rfc-editor.org/rfc/rfc2326.html#section-6.1
  - name: protocol.rtsp.response
    match:
      - field: flow.transport
        op: equals_any
        values:
          - tcp
      - side: R
        op: candidate_seen
    candidates:
      - side: R
        regex: '^(?:\x0d\x0a){0,4}RTSP/[12]\.0 [1-5][0-9]{2} [^\x0d\x0a]*\x0d\x0a'
    sources:
      - project: rfc-editor
        url: https://www.rfc-editor.org/rfc/rfc7826.html#section-8.1
  - name: protocol.rtcp.sender-report
    match:
      - field: flow.transport
        op: equals_any
        values:
          - udp
      - side: E
        op: size_between
        min: 28
        max: 65535
      - side: E
        op: uint_at
        offset: 0
        width: 1
        endian: be
        mask: 192
        masked_value: 128
      - side: E
        op: hex_at
        offset: 1
        value: "C8"
      - side: E
        op: uint_at
        offset: 2
        width: 2
        endian: be
        min: 6
      - side: E
        op: size_from_uint_at
        offset: 2
        width: 2
        endian: be
        multiplier: 4
        adjustment: 4
        repeat: true
    candidates:
      - side: E
        regex: '^[\x80-\x9f]\xc8'
    sources:
      - project: rfc-editor
        url: https://www.rfc-editor.org/rfc/rfc3550.html#section-6.4.1
  - name: protocol.rtcp.receiver-report
    match:
      - field: flow.transport
        op: equals_any
        values:
          - udp
      - side: E
        op: size_between
        min: 8
        max: 65535
      - side: E
        op: uint_at
        offset: 0
        width: 1
        endian: be
        mask: 192
        masked_value: 128
      - side: E
        op: hex_at
        offset: 1
        value: "C9"
      - side: E
        op: uint_at
        offset: 2
        width: 2
        endian: be
        min: 1
      - side: E
        op: size_from_uint_at
        offset: 2
        width: 2
        endian: be
        multiplier: 4
        adjustment: 4
        repeat: true
    candidates:
      - side: E
        regex: '^[\x80-\x9f]\xc9'
    sources:
      - project: rfc-editor
        url: https://www.rfc-editor.org/rfc/rfc3550.html#section-6.4.2
  - name: protocol.dhcpv6.client-message
    match:
      - field: flow.transport
        op: equals_any
        values:
          - udp
      - side: L
        op: size_between
        min: 8
        max: 65535
      - side: L
        op: uint_at
        offset: 0
        width: 1
        endian: be
        masked_values:
          - 1
          - 3
          - 4
          - 5
          - 6
          - 8
          - 9
          - 11
        mask: 255
      - side: L
        op: tlv_sequence_at
        offset: 4
        code_width: 2
        length_width: 2
        endian: be
        min_items: 1
    candidates:
      - side: L
        regex: '^[\x01\x03-\x06\x08\x09\x0b][\x00-\xff]{3}'
    sources:
      - project: rfc-editor
        url: https://www.rfc-editor.org/rfc/rfc9915.html#section-8
  - name: protocol.dhcpv6.server-message
    match:
      - field: flow.transport
        op: equals_any
        values:
          - udp
      - side: R
        op: size_between
        min: 8
        max: 65535
      - side: R
        op: uint_at
        offset: 0
        width: 1
        endian: be
        masked_values:
          - 2
          - 7
          - 10
        mask: 255
      - side: R
        op: tlv_sequence_at
        offset: 4
        code_width: 2
        length_width: 2
        endian: be
        min_items: 1
    candidates:
      - side: R
        regex: '^[\x02\x07\x0a][\x00-\xff]{3}'
    sources:
      - project: rfc-editor
        url: https://www.rfc-editor.org/rfc/rfc9915.html#section-8
  - name: protocol.s7comm.setup-communication.request
    match:
      - field: flow.transport
        op: equals_any
        values:
          - tcp
      - side: L
        op: size_between
        min: 25
        max: 25
      - side: L
        op: hex_at
        offset: 0
        value: "0300001902F0803201"
      - side: L
        op: hex_at
        offset: 9
        value: "0000"
      - side: L
        op: hex_at
        offset: 13
        value: "00080000F000"
      - side: L
        op: uint_at
        offset: 19
        width: 2
        endian: be
        min: 1
      - side: L
        op: uint_at
        offset: 21
        width: 2
        endian: be
        min: 1
      - side: L
        op: uint_at
        offset: 23
        width: 2
        endian: be
        min: 240
    candidates:
      - side: L
        regex: '^\x03\x00\x00\x19\x02\xf0\x80\x32\x01'
    sources:
      - project: wireshark
        url: https://github.com/wireshark/wireshark/blob/6cf21a765b876ad27722a1fb7daa97886e42d544/epan/dissectors/packet-s7comm.c
  - name: protocol.s7comm.setup-communication.response
    match:
      - field: flow.transport
        op: equals_any
        values:
          - tcp
      - side: R
        op: size_between
        min: 27
        max: 27
      - side: R
        op: hex_at
        offset: 0
        value: "0300001B02F0803203"
      - side: R
        op: hex_at
        offset: 9
        value: "0000"
      - side: R
        op: hex_at
        offset: 13
        value: "000800000000F000"
      - side: R
        op: uint_at
        offset: 21
        width: 2
        endian: be
        min: 1
      - side: R
        op: uint_at
        offset: 23
        width: 2
        endian: be
        min: 1
      - side: R
        op: uint_at
        offset: 25
        width: 2
        endian: be
        min: 240
    candidates:
      - side: R
        regex: '^\x03\x00\x00\x1b\x02\xf0\x80\x32\x03'
    sources:
      - project: wireshark
        url: https://github.com/wireshark/wireshark/blob/6cf21a765b876ad27722a1fb7daa97886e42d544/epan/dissectors/packet-s7comm.c
