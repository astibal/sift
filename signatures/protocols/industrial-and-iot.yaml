        regex: '^\x10(?:[\x00-\x7f]|[\x80-\xff][\x00-\x7f]|[\x80-\xff]{2}[\x00-\x7f]|[\x80-\xff]{3}[\x00-\x7f])\x00\x04MQTT[\x04\x05]'
