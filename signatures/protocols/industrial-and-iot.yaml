signatures:
  - name: protocol.iec104.i-format
    match:
      - field: flow.transport
        op: equals_any
        values:
          - tcp
      - side: E
        op: size_between
        min: 6
        max: 257
      - side: E
        op: hex_at
        offset: 0
        value: "68"
      - side: E
        op: size_from_uint_at
        offset: 1
        width: 1
        endian: be
        adjustment: 2
      - side: E
        op: uint_at
        offset: 2
        width: 1
        endian: be
        mask: 1
        masked_value: 0
    candidates:
      - side: E
        regex: '^\x68.'
    sources:
      - project: wireshark
        url: https://github.com/wireshark/wireshark/blob/6cf21a765b876ad27722a1fb7daa97886e42d544/epan/dissectors/packet-iec104.c
  - name: protocol.iec104.s-format
    match:
      - field: flow.transport
        op: equals_any
        values:
          - tcp
      - side: E
        op: size_between
        min: 6
        max: 6
      - side: E
        op: hex_at
        offset: 0
        value: "680401000000"
    candidates:
      - side: E
        regex: '^\x68\x04\x01\x00\x00\x00'
    sources:
      - project: wireshark
        url: https://github.com/wireshark/wireshark/blob/6cf21a765b876ad27722a1fb7daa97886e42d544/epan/dissectors/packet-iec104.c
  - name: protocol.iec104.u-format
    match:
      - field: flow.transport
        op: equals_any
        values:
          - tcp
      - side: E
        op: size_between
        min: 6
        max: 6
      - side: E
        op: hex_at
        offset: 0
        value: "6804"
      - side: E
        op: uint_at
        offset: 2
        width: 1
        endian: be
        mask: 255
        masked_values:
          - 7
          - 11
          - 19
          - 35
          - 67
          - 131
      - side: E
        op: hex_at
        offset: 3
        value: "000000"
    candidates:
      - side: E
        regex: '^\x68\x04[\x07\x0b\x13\x23\x43\x83]\x00\x00\x00'
    sources:
      - project: wireshark
        url: https://github.com/wireshark/wireshark/blob/6cf21a765b876ad27722a1fb7daa97886e42d544/epan/dissectors/packet-iec104.c
